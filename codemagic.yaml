workflows:
  ios-check:
    name: J1ROX TV iOS - Compile check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - tmdb
      xcode: latest
      vars:
        XCODE_PROJECT: "J1ROXTV.xcodeproj"
        XCODE_SCHEME: "J1ROXTV"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "main"
          include: true
          source: false
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - "J1ROX_TV_iOS/**"
          - "codemagic.yaml"
          - ".gitattributes"
    scripts:
      - name: Configure TMDB credentials
        script: |
          python3 - <<'PYCONFIG'
          import os, plistlib
          from pathlib import Path
          path = Path(os.environ['CM_BUILD_DIR']) / 'J1ROX_TV_iOS/J1ROXTV/Resources/Info.plist'
          data = plistlib.loads(path.read_bytes())
          for setting, env in [('TMDBReadAccessToken', 'TMDB_READ_ACCESS_TOKEN'), ('TMDBAPIKey', 'TMDB_API_KEY')]:
              data[setting] = os.environ.get(env, '').strip()
          path.write_bytes(plistlib.dumps(data))
          print('TMDB configuration applied')
          PYCONFIG
      - name: Xcode version, project, shared scheme and target diagnostics
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR/J1ROX_TV_iOS"
          mkdir -p build/logs build/artifacts build/results
          exec > >(tee build/logs/xcode-environment.log) 2>&1
          xcodebuild -version
          xcrun swift --version
          git rev-parse HEAD
          test -f "$XCODE_PROJECT/project.pbxproj"
          test -f "$XCODE_PROJECT/xcshareddata/xcschemes/$XCODE_SCHEME.xcscheme"
          xcodebuild -project "$XCODE_PROJECT" -list
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -configuration Debug -sdk iphonesimulator \
            -showBuildSettings CODE_SIGNING_ALLOWED=NO
          # No external SPM, CocoaPods or Carthage dependencies in this project.
      - name: BUILD - Debug iOS Simulator (unsigned)
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR/J1ROX_TV_iOS"
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -configuration Debug -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData-debug -resultBundlePath build/results/debug-build.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_SUPPRESS_WARNINGS=NO GCC_WARN_INHIBIT_ALL_WARNINGS=NO \
            build 2>&1 | tee build/logs/debug-build.log
      - name: ARTIFACT - Package the unmodified simulator app
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR/J1ROX_TV_iOS"
          APP_PATH="build/DerivedData-debug/Build/Products/Debug-iphonesimulator/J1ROXTV.app"
          test -s "$APP_PATH/J1ROXTV"
          test -s "$APP_PATH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "com.jirox.jiroxtv"
          # A real simulator .app archive, not an installable iPhone IPA.
          # Package before smoke tests add a local-networking exception to their copy.
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/artifacts/J1ROXTV-Debug-iphonesimulator.zip
          unzip -tq build/artifacts/J1ROXTV-Debug-iphonesimulator.zip
      - name: BUILD - Release iOS device compile check (unsigned)
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR/J1ROX_TV_iOS"
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData-check -resultBundlePath build/results/release-build.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_STRICT_CONCURRENCY=complete SWIFT_SUPPRESS_WARNINGS=NO GCC_WARN_INHIBIT_ALL_WARNINGS=NO \
            build 2>&1 | tee build/logs/unsigned-build.log
      - name: TESTS - Provider, series, HLS and download regressions
        script: |
          #!/bin/bash
          set -euo pipefail
          bash "$CM_BUILD_DIR/J1ROX_TV_iOS/Tests/run-ci-regressions.sh"
    artifacts:
      - J1ROX_TV_iOS/build/artifacts/*.zip
      - J1ROX_TV_iOS/build/logs/**
      - J1ROX_TV_iOS/build/results/*.xcresult
      - J1ROX_TV_iOS/build/DerivedData-debug/Logs/Build/*.xcactivitylog
      - J1ROX_TV_iOS/build/DerivedData-check/Logs/Build/*.xcactivitylog

  ios-ipa:
    name: J1ROX TV iOS - Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - tmdb
      xcode: latest
    scripts:
      - &tmdb-setup
        name: Configure TMDB credentials
        script: |
          python3 - <<'PYCONFIG'
          import os, plistlib
          from pathlib import Path
          path = Path(os.environ['CM_BUILD_DIR']) / 'J1ROX_TV_iOS/J1ROXTV/Resources/Info.plist'
          data = plistlib.loads(path.read_bytes())
          for setting, env in [('TMDBReadAccessToken', 'TMDB_READ_ACCESS_TOKEN'), ('TMDBAPIKey', 'TMDB_API_KEY')]:
              data[setting] = os.environ.get(env, '').strip()
          path.write_bytes(plistlib.dumps(data))
          print('TMDB configuration applied')
          PYCONFIG
      - &provider-regressions
        name: Provider regression tests
        script: |
          #!/bin/bash
          set -euo pipefail
          bash "$CM_BUILD_DIR/J1ROX_TV_iOS/Tests/run-provider-tests.sh"
      - &release-ipa-build
        name: Build unsigned Release app
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR/J1ROX_TV_iOS"
          mkdir -p build/logs
          test -f J1ROXTV.xcodeproj/project.pbxproj
          test -f J1ROXTV.xcodeproj/xcshareddata/xcschemes/J1ROXTV.xcscheme
          xcodebuild \
            -project J1ROXTV.xcodeproj \
            -scheme J1ROXTV \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData-ipa \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/logs/unsigned-ipa-build.log
      - &release-ipa-package
        name: Package and verify unsigned IPA
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR/J1ROX_TV_iOS"
          mkdir -p build/logs
          exec > >(tee build/logs/unsigned-ipa-package.log) 2>&1
          APP_PATH="build/DerivedData-ipa/Build/Products/Release-iphoneos/J1ROXTV.app"
          test -d "$APP_PATH"
          test -s "$APP_PATH/J1ROXTV"
          test -x "$APP_PATH/J1ROXTV"
          test -s "$APP_PATH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "com.jirox.jiroxtv"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")" = "J1ROXTV"
          # Recreate only the packaging output to avoid stale archive entries.
          rm -rf build/ipa/Payload
          rm -f build/ipa/J1ROXTV-unsigned.ipa
          mkdir -p build/ipa/Payload
          ditto "$APP_PATH" build/ipa/Payload/J1ROXTV.app
          cd build/ipa
          zip -qry J1ROXTV-unsigned.ipa Payload
          test -s J1ROXTV-unsigned.ipa
          unzip -tq J1ROXTV-unsigned.ipa
          python3 - <<'PY'
          import plistlib
          import zipfile
          from pathlib import Path

          ipa = Path("J1ROXTV-unsigned.ipa")
          assert ipa.is_file() and ipa.stat().st_size > 0, "IPA is missing or empty"
          with zipfile.ZipFile(ipa) as archive:
              assert all(name.startswith("Payload/") for name in archive.namelist()), "Unexpected IPA root"
              for name in ("Payload/J1ROXTV.app/J1ROXTV", "Payload/J1ROXTV.app/Info.plist"):
                  assert archive.getinfo(name).file_size > 0, f"Missing or empty IPA entry: {name}"
              info = plistlib.loads(archive.read("Payload/J1ROXTV.app/Info.plist"))
              assert info["CFBundleIdentifier"] == "com.jirox.jiroxtv", "Unexpected Bundle ID"
              assert info["CFBundleExecutable"] == "J1ROXTV", "Unexpected executable"
          print(f"Verified unsigned IPA: {ipa.resolve()} ({ipa.stat().st_size} bytes)")
          PY
    artifacts:
      - J1ROX_TV_iOS/build/ipa/*.ipa
      - J1ROX_TV_iOS/build/logs/**

  ios-testflight:
    name: J1ROX TV iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - tmdb
        - appstore_credentials
      xcode: latest
      vars:
        BUNDLE_ID: "com.jirox.jiroxtv"
        XCODE_PROJECT: "J1ROXTV.xcodeproj"
        XCODE_SCHEME: "J1ROXTV"
        MARKETING_VERSION: "1.0.0"
    scripts:
      - name: Configure TMDB credentials
        script: |
          python3 - <<'PYCONFIG'
          import os, plistlib
          from pathlib import Path
          path = Path(os.environ['CM_BUILD_DIR']) / 'J1ROX_TV_iOS/J1ROXTV/Resources/Info.plist'
          data = plistlib.loads(path.read_bytes())
          for setting, env in [('TMDBReadAccessToken', 'TMDB_READ_ACCESS_TOKEN'), ('TMDBAPIKey', 'TMDB_API_KEY')]:
              data[setting] = os.environ.get(env, '').strip()
          path.write_bytes(plistlib.dumps(data))
          print('TMDB configuration applied')
          PYCONFIG
      - name: Validate project and required credentials
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR/J1ROX_TV_iOS"
          test -f "$XCODE_PROJECT/project.pbxproj"
          test -f "$XCODE_PROJECT/xcshareddata/xcschemes/$XCODE_SCHEME.xcscheme"
          test -f "ExportOptions.plist"
          : "${APPLE_TEAM_ID:?Add APPLE_TEAM_ID to the appstore_credentials group}"
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?Add APP_STORE_CONNECT_KEY_IDENTIFIER}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Add APP_STORE_CONNECT_ISSUER_ID}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Add APP_STORE_CONNECT_PRIVATE_KEY as a Secret}"
          : "${CERTIFICATE_PRIVATE_KEY:?Add CERTIFICATE_PRIVATE_KEY as a Secret}"
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -list
      - name: Unsigned Release compile check
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR/J1ROX_TV_iOS"
          mkdir -p build/logs
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData-check \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/logs/unsigned-build.log
      - name: Fetch App Store signing files
        script: |
          #!/bin/bash
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          cd "$CM_BUILD_DIR/J1ROX_TV_iOS"
          xcode-project use-profiles
      - name: Create signed archive
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR/J1ROX_TV_iOS"
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/J1ROXTV.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee build/logs/archive.log
      - name: Export IPA
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR/J1ROX_TV_iOS"
          mkdir -p build/ipa
          xcodebuild -exportArchive \
            -archivePath build/J1ROXTV.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            2>&1 | tee build/logs/export.log
          test -n "$(find build/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
    artifacts:
      - J1ROX_TV_iOS/build/ipa/*.ipa
      - J1ROX_TV_iOS/build/J1ROXTV.xcarchive/dSYMs/**/*.dSYM
      - J1ROX_TV_iOS/build/logs/*.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  ios-zona-ipa:
    name: J1ROX TV iOS - Zona validation and IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups:
        - tmdb
      xcode: latest
    scripts:
      - *tmdb-setup
      - *provider-regressions
      - name: Build Debug simulator for live Zona diagnostic
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR/J1ROX_TV_iOS"
          mkdir -p build/logs
          xcodebuild -project J1ROXTV.xcodeproj -scheme J1ROXTV \
            -configuration Debug -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData-debug CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/logs/zona-debug-build.log
      - name: Live Zona SDK and AVFoundation diagnostic
        script: |
          #!/bin/bash
          set -euo pipefail
          bash "$CM_BUILD_DIR/J1ROX_TV_iOS/Tests/run-zona-smoke.sh"
      - *release-ipa-build
      - *release-ipa-package
    artifacts:
      - J1ROX_TV_iOS/build/ipa/*.ipa
      - J1ROX_TV_iOS/build/logs/**

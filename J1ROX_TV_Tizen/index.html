<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, initial-scale=1">
    <title>J1ROX TV</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <object id="av-player" type="application/avplayer"></object>
    <video id="web-player" playsinline></video>
    <div id="stage">
        <header id="header"><div class="brand">J1ROX<span>TV</span></div><nav id="nav" aria-label="Разделы"></nav><span class="platform">SAMSUNG TV</span></header>
        <main id="content"></main>
        <section id="playback" tabindex="-1" hidden aria-label="Видеоплеер">
            <div id="player-status" role="status"></div>
            <div id="player-controls">
                <div class="eyebrow">СЕЙЧАС СМОТРИТЕ</div><h1 id="player-title"></h1>
                <div id="player-description"></div><progress id="timeline" max="1" value="0"></progress>
                <div id="player-time"></div><div id="player-actions"></div>
                <p class="hint">← → перемотка · OK панель · ↑ ↓ действия · Play/Pause · Return назад</p>
            </div>
        </section>
        <div id="toast" role="status" hidden></div>
        <footer id="footer">← → ↑ ↓ Выбор <span>OK Открыть</span><span>Return Назад</span></footer>
    </div>
    <script src="$WEBAPIS/webapis/webapis.js"></script>
    <script src="js/models.js"></script>
    <script src="js/api.js"></script>
    <script src="js/library.js"></script>
    <script src="js/focus.js"></script>
    <script src="js/player.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
